apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: invoices-microservice-secret
  namespace: statex-apps
  labels:
    app: invoices-microservice
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: invoices-microservice-secret
    creationPolicy: Owner
  data:
    - secretKey: DB_PASSWORD
      remoteRef:
        key: secret/prod/invoices-microservice
        property: DB_PASSWORD
    - secretKey: ORDERS_SERVICE_TOKEN
      remoteRef:
        key: secret/prod/invoices-microservice
        property: ORDERS_SERVICE_TOKEN
    # S2S: auth-microservice/docs/SERVICE_IDENTITY_CONSUMER_STANDARD.md
    - secretKey: PAYMENTS_SERVICE_TOKEN
      remoteRef:
        key: secret/prod/invoices-microservice
        property: PAYMENTS_SERVICE_TOKEN
    - secretKey: NOTIFICATIONS_SERVICE_TOKEN
      remoteRef:
        key: secret/prod/invoices-microservice
        property: NOTIFICATIONS_SERVICE_TOKEN
    # S2S: auth-microservice/docs/SERVICE_IDENTITY_CONSUMER_STANDARD.md
    # path as CREDENTIAL_INGEST_TOKEN. Do NOT share monitoring's
    - secretKey: MONITORING_INGEST_SERVICE_TOKEN
      remoteRef:
        key: secret/prod/invoices-microservice
        property: CREDENTIAL_INGEST_TOKEN
    # S2S: auth-microservice/docs/SERVICE_IDENTITY_CONSUMER_STANDARD.md
    # Role internal:logging-microservice:ingest. Without this the service ships
    # no logs at all: LogIngestGuard fails closed (401) and every log line is
    # lost silently, so error alerting cannot see this service.
    - secretKey: LOGGING_SERVICE_TOKEN
      remoteRef:
        key: secret/prod/invoices-microservice
        property: LOGGING_SERVICE_TOKEN
