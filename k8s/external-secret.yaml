apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: invoices-microservice-secret
  namespace: statex-apps
  labels:
    app: invoices-microservice
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: invoices-microservice-secret
    creationPolicy: Owner
  data:
    - secretKey: DB_PASSWORD
      remoteRef:
        key: secret/prod/invoices-microservice
        property: DB_PASSWORD
    - secretKey: INVOICES_INTERNAL_SERVICE_TOKEN
      remoteRef:
        key: secret/prod/invoices-microservice
        property: INVOICES_INTERNAL_SERVICE_TOKEN
    - secretKey: ORDERS_SERVICE_TOKEN
      remoteRef:
        key: secret/prod/invoices-microservice
        property: ORDERS_SERVICE_TOKEN
    - secretKey: PAYMENTS_API_KEY
      remoteRef:
        key: secret/prod/invoices-microservice
        property: PAYMENTS_API_KEY
    - secretKey: NOTIFICATIONS_SERVICE_TOKEN
      remoteRef:
        key: secret/prod/invoices-microservice
        property: NOTIFICATIONS_SERVICE_TOKEN
    # Ingest credential for posting credential self-reports to monitoring
    # (SERVICE_CREDENTIAL_PROBER_PLAN.md Task A). Not a probe credential: it
    # authenticates the report, never the lane being reported on.
    #
    # NOTE the property name is PLURAL. monitoring's own ExternalSecret maps env
    # NOTIFICATION_SERVICE_TOKEN <- Vault NOTIFICATIONS_SERVICE_TOKEN, and
    # MonitoringIngestGuard compares against that running value. The singular key
    # also exists in monitoring's path with a different, stale value; using it
    # yields a token the guard rejects with 403 while the probe itself succeeds.
    - secretKey: NOTIFICATION_SERVICE_TOKEN
      remoteRef:
        key: secret/prod/monitoring-microservice
        property: NOTIFICATIONS_SERVICE_TOKEN
